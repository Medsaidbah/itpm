# Example to try the app (and its database) on one machine:
#   cp docker.env.example .env.docker      (then edit the secrets)
#   docker compose --env-file .env.docker up --build
#   docker compose --env-file .env.docker exec web python manage.py createsuperuser
# then open http://localhost:8000
# In production the infrastructure team uses its own PostgreSQL, proxy and secrets: see DEPLOY-DOCKER.md.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - itpm_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    image: itpm:1.0.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &app-env
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      HTTPS: ${HTTPS}
      HSTS_SECONDS: ${HSTS_SECONDS}
      SITE_URL: ${SITE_URL}
      TRUSTED_PROXY: ${TRUSTED_PROXY}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      EMAIL_BACKEND: ${EMAIL_BACKEND}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      EMAIL_DEFAULT_LANGUAGE: ${EMAIL_DEFAULT_LANGUAGE:-fr}
      EMAIL_IN_BACKGROUND: ${EMAIL_IN_BACKGROUND:-True}
      # Only for EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend (an SMTP server, like smtp.office365.com)
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      GRAPH_SENDER: ${GRAPH_SENDER:-}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"   # default: this machine only. BIND_ADDRESS=0.0.0.0 in docker.env opens it to the network
    volumes:
      - itpm_media:/app/media

  # Scheduled jobs (same image, same settings). They do not run with "up": the scheduler calls them, see DEPLOY-DOCKER.md.
  #   daily:           docker compose --env-file docker.env --profile jobs run --rm reminders
  #   every 10 minutes: docker compose --env-file docker.env --profile jobs run --rm outbox
  reminders:
    image: itpm:1.0.1
    profiles: ["jobs"]
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    command: ["python", "manage.py", "send_reminders"]

  outbox:
    image: itpm:1.0.1
    profiles: ["jobs"]
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    command: ["python", "manage.py", "send_outbox"]

volumes:
  itpm_db:
  itpm_media:
