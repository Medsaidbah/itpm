{% if picture_url %}<span class="avatar avatar-{{ size }} flex-shrink-0" style="background-image: url('{{ picture_url }}')" title="{{ person }}" role="img" aria-label="{{ person }}"></span>{% elif person %}<span class="avatar avatar-{{ size }} flex-shrink-0" title="{{ person }}">{{ person.initials }}</span>{% else %}<span class="avatar avatar-{{ size }} flex-shrink-0" title="Unassigned">?</span>{% endif %}{# A round picture of a person, or their initials (made by {% avatar person %}, see accounts/templatetags/people.py). One line, no line break. #}
