x-app-environment: &app-environment
  # --- Application (obligatoire) ---
  SECRET_KEY: ${SECRET_KEY}                # secret long et alÃ©atoire ; le changer dÃ©connecte tout le monde
  DEBUG: "False"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}          # nom(s) de domaine public(s), sÃ©parÃ©s par des virgules
  HTTPS: ${HTTPS}                          # True : le site est servi en https:// via le reverse proxy
  HSTS_SECONDS: ${HSTS_SECONDS:-3600}
  SITE_URL: ${SITE_URL}                    # adresse publique complÃ¨te (https://...), utilisÃ©e dans les liens des e-mails
  TRUSTED_PROXY: ${TRUSTED_PROXY}          # adresse du reverse proxy (ou * si seul le proxy atteint le conteneur)
  # --- Base de donnÃ©es PostgreSQL 16 ou plus rÃ©cent (obligatoire) ---
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}                      # doit pouvoir crÃ©er des tables (migrations)
  DB_PASSWORD: ${DB_PASSWORD}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-5432}
  # --- E-mail (facultatif au dÃ©but ; sans configuration, les e-mails sont seulement Ã©crits dans les logs) ---
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
  EMAIL_DEFAULT_LANGUAGE: ${EMAIL_DEFAULT_LANGUAGE:-fr}
  EMAIL_IN_BACKGROUND: ${EMAIL_IN_BACKGROUND:-True}
  #   Serveur SMTP (EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend)
  EMAIL_HOST: ${EMAIL_HOST:-localhost}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}      # secret
  #   Microsoft 365 (EMAIL_BACKEND=config.graph_email.GraphEmailBackend), voir EMAIL-M365-SETUP.md
  GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
  GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
  GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}      # secret
  GRAPH_SENDER: ${GRAPH_SENDER:-}
  # --- Premier administrateur (Ã  utiliser une seule fois, puis supprimer DJANGO_SUPERUSER_PASSWORD) ---
  DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}

services:
