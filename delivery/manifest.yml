  web:
    # Ã€ REMPLACER par le nom rÃ©el : registry-mtnima.gov.mr/[NOM_INSTITUTION]/[NOM_APP]:[VERSION]
    image: registry-mtnima.gov.mr/ddirepo/mchariee:1.0.0
    restart: unless-stopped
    environment: *app-environment
    ports:
      - "8000:8000"          # le reverse proxy du MTNIMA se connecte ici
    volumes:
      - itpm_media:/app/media   # fichiers dÃ©posÃ©s par les utilisateurs (piÃ¨ces jointes, photos) : Ã€ SAUVEGARDER
    deploy:
      resources:
        reservations:        # minimum nÃ©cessaire
          cpus: "0.5"
          memory: 512M
        limits:              # plafond conseillÃ©
          cpus: "1.0"
          memory: 1G
    # La vÃ©rification de santÃ© est dÃ©jÃ  dans l'image (GET /healthz/ : Â« ok Â» si la base rÃ©pond, sinon 503).
    # Les logs sont Ã©crits sur la sortie standard (stdout/stderr) du conteneur.

  # --- TÃ¢ches planifiÃ©es (mÃªme image, mÃªme environnement). Elles ne tournent pas en continu : le planificateur du
  # --- MTNIMA les lance avec :  docker compose -f manifest.yml --profile jobs run --rm rappels
  rappels:                   # 1 fois par jour (par exemple Ã  07:00) : e-mail de rappel des tÃ¢ches en retard / proches
    image: registry-mtnima.gov.mr/ddirepo/mchariee:1.0.0
    profiles: ["jobs"]
    environment: *app-environment
    command: ["python", "manage.py", "send_reminders"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  boite-d-envoi:             # toutes les 10 minutes : renvoie les e-mails qui ont Ã©chouÃ© et nettoie la boÃ®te d'envoi
    image: registry-mtnima.gov.mr/ddirepo/mchariee:1.0.0
    profiles: ["jobs"]
    environment: *app-environment
    command: ["python", "manage.py", "send_outbox"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

